name: Scraper and Auto-Commit CSV

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 1. 明確授權 GitHub Actions 具有寫入專案的權限
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Python script
        run: |
          python bot.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data.csv
          
          # 2. 檢查是否有檔案變更，有才進行 Commit 與 Push
          git diff --staging --quiet || (git commit -m "Auto-update scraped data.csv [skip ci]" && git push)
