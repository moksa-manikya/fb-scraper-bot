name: Run Facebook Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 時間 00:00 (台北時間早上 8:00) 執行一次
  workflow_dispatch:     # 允許在網頁手動點擊按鈕立即觸發

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: 執行爬蟲程式
        run: python main.py

      - name: 上傳抓取到的 CSV 檔案
        uses: actions/upload-artifact@v4
        with:
          name: scraped-posts
          path: '*.csv'
